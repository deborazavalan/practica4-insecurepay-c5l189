name: verificacion

on:
  push:
    branches: [main]
    paths-ignore:
      - 'evidencias/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar backend
        working-directory: backend
        run: mvn -B -q -DskipTests package

      - name: Compilar frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx ng build --configuration production

      - name: Iniciar backend
        run: |
          nohup java -jar backend/target/*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api > /dev/null && break
            sleep 2
          done

      - name: Pruebas periciales
        run: |
          mkdir -p evidencias
          bash scripts/pruebas.sh 2>&1 | tee evidencias/pruebas-curl.txt
          exit ${PIPESTATUS[0]}

      - name: Log del backend
        if: always()
        run: tail -n 80 backend.log
